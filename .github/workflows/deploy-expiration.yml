# This workflow will build a docker container, publish it to Google Container Registry, and deploy it to GKE when there is a push to the "main" branch.
#
# To configure this workflow:
#
# 1. Ensure that your repository contains the necessary configuration for your Google Kubernetes Engine cluster, including deployment.yml, kustomization.yml, service.yml, etc.
#
# 2. Create and configure a Workload Identity Provider for GitHub (https://github.com/google-github-actions/auth#setting-up-workload-identity-federation)
#
# 3. Change the values for the GAR_LOCATION, GKE_ZONE, GKE_CLUSTER, IMAGE, REPOSITORY and DEPLOYMENT_NAME environment variables (below).
#
# For more support on how to run the workflow, please visit https://github.com/google-github-actions/setup-gcloud/tree/master/example-workflows/gke-kustomize

name: deploy-expiration

on:
  push:
    branches:
      - main
    paths:
      - "expiration/**"

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  PROJECT_NUMBER: ${{ secrets.GKE_PROJECT_NUMBER }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }} # region of the Artifact Registry
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }} # gke cluster name
  GKE_ZONE: ${{ secrets.GKE_ZONE }} # gke cluster zone
  SERVICE_ACCOUNT: ${{ secrets.GKE_SERVICE_ACCOUNT }}
  REPOSITORY: ${{ secrets.GAR_NAME }} #gcp Artifact Registry docker repository
  IMAGE: expiration

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure Workload Identity Federation and generate an access token.
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/tickets-pool/providers/github"
          service_account: "${{ env.SERVICE_ACCOUNT }}"

      - name: Docker configuration
        run: |-
          echo ${{steps.auth.outputs.access_token}} | docker login -u oauth2accesstoken --password-stdin https://$GAR_LOCATION-docker.pkg.dev

      # Get the GKE credentials so we can deploy to the cluster
      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      # Build the Docker image
      - name: Build
        run: |-
          docker build \
            --tag "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE" \
            ./expiration
      # Push the Docker image to Google Artifact Registry
      - name: Publish
        run: |-
          docker push "$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE"

      # Deploy the Docker image to the GKE cluster
      - name: Deploy
        run: |-
          kubectl rollout restart deployment expiration-depl
