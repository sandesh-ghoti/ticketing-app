apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket
  template:
    metadata:
      labels:
        app: ticket
    spec:
      containers:
        - name: ticket
          image: us-central1-docker.pkg.dev/long-stack-426216-q2/tickets-repo/ticket
          resources:
            limits:
              memory: "400Mi"
              cpu: "200m"
          env:
            - name: MONGO_URI
              value: "mongodb://ticket-mongo-srv:27017/ticket"
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: STREAM_NAME
              value: "Ticketing"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-srv
spec:
  selector:
    app: ticket
  ports:
    - name: ticket
      protocol: TCP
      port: 3000
      targetPort: 3000
