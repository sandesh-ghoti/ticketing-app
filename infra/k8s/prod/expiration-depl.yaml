apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expiration
  template:
    metadata:
      labels:
        app: expiration
    spec:
      containers:
        - name: expiration
          image: us-central1-docker.pkg.dev/long-stack-426216-q2/tickets-repo/expiration
          resources:
            limits:
              memory: "400Mi"
              cpu: "200m"
          env:
            - name: MONGO_URI
              value: "mongodb://expiration-mongo-srv:27017/expiration"
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: STREAM_NAME
              value: "Ticketing"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: REDIS_HOST
              # value of the hostname for the register that we want to connect to
              value: expiration-redis-srv
