apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: us-central1-docker.pkg.dev/long-stack-426216-q2/tickets-repo/payment
          resources:
            limits:
              memory: "300Mi"
              cpu: "200m"
          env:
            - name: MONGO_URI
              value: "mongodb://payment-mongo-srv:27017/payment"
            - name: NATS_URL
              value: "http://nats-srv:4222"
            - name: STREAM_NAME
              value: "Ticketing"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: payment-srv
spec:
  selector:
    app: payment
  ports:
    - name: payment
      protocol: TCP
      port: 3000
      targetPort: 3000
